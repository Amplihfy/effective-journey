<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2a24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cemetery Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚰</span>
      <h1>Cemetery Dashboard</h1>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <main>
    <!-- Session control -->
    <section class="card session-card">
      <div class="session-active" id="sessionActive" hidden>
        <div>
          <span class="muted">Active session</span>
          <strong id="sessionName"></strong>
        </div>
        <button class="btn ghost" id="endSessionBtn">End session</button>
      </div>
      <form class="session-form" id="sessionForm">
        <h2>Start a logging session</h2>
        <div class="row">
          <input id="sName" placeholder="Session name (e.g. North survey)" required />
          <input id="sOperator" placeholder="Operator (your name)" />
        </div>
        <button class="btn primary" type="submit">Start session</button>
      </form>
    </section>

    <!-- Add record -->
    <section class="card" id="recordCard" hidden>
      <h2>Add record</h2>
      <form id="recordForm" class="record-form">
        <input id="deceased_name" placeholder="Deceased name *" required />
        <div class="row">
          <input id="section" placeholder="Section" />
          <input id="plot" placeholder="Plot / row" />
        </div>
        <div class="row">
          <label class="field"><span>Born</span><input id="birth_date" type="date" /></label>
          <label class="field"><span>Died</span><input id="death_date" type="date" /></label>
        </div>
        <textarea id="notes" placeholder="Notes (inscription, condition, etc.)"></textarea>
        <div class="row">
          <button class="btn primary" type="submit">Save record</button>
          <button class="btn ghost" type="button" id="geoBtn">📍 Use my location</button>
        </div>
        <p class="muted" id="geoStatus"></p>
      </form>
    </section>

    <!-- Records viewer -->
    <section class="card">
      <div class="viewer-head">
        <h2>Records</h2>
        <div class="tabs" role="tablist">
          <button class="tab active" id="tabList" role="tab" aria-selected="true">List</button>
          <button class="tab" id="tabMap" role="tab" aria-selected="false">Map</button>
        </div>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" inputmode="search"
               placeholder="Search by name, section, plot, notes…" autocomplete="off" />
      </div>
      <p class="muted" id="viewerInfo"></p>
      <div id="results" class="results"></div>
      <div id="map" class="map" hidden></div>
    </section>
  </main>

  <!-- Detail view -->
  <div class="modal" id="detail" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dName">
      <button class="modal-close" id="detailClose" aria-label="Close">✕</button>
      <h2 id="dName"></h2>
      <dl class="detail-grid" id="dGrid"></dl>
      <div id="dNotes" class="detail-notes"></div>
      <div class="detail-actions" id="dActions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
